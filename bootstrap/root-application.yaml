apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-pilot-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/IvayloB84/ArgoCD-RootApps'
    targetRevision: main
    # Point directly to the folder; recurse handles the rest
    path: "argocd-apps"
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true