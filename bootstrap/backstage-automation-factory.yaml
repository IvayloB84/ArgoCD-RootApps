apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-automation-factory
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/IvayloB84/ArgoCD-RootApps"
    targetRevision: main
    path: argocd-apps
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
