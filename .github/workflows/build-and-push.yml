name: Build and Push Container Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A single recent JDK can compile+package for either Java 17 or 21
      # targets (Maven's release flag in pom.xml, set by Initializr, handles
      # the actual target version) — so this doesn't need to be templated.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: 
          password: 

      # GHCR requires a lowercase image path; github.repository preserves
      # the repo's actual casing, so normalize it first.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            :latest
            :
