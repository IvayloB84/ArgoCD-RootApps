name: Automated Deactivation and Repository Cleanup

on:
  pull_request:
    types: [opened, closed]
    branches:
      - main

jobs:
  # PHASE 1: Generates the visual verification layout on the PR page for the admin instantly
  verify-deactivation-intent:
    if: github.event.action == 'opened' && startsWith(github.event.pull_request.head.ref, 'cleanup-remove-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backstage PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.REPO_DELETE_PAT }}

      - name: Extract Target App Name
        id: parse
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          REPO_TO_DELETE="${BRANCH_NAME#cleanup-remove-}"
          echo "target_repo=$REPO_TO_DELETE" >> $GITHUB_OUTPUT

      - name: Force a Visual Deletion Warning Diff in the PR Viewport
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Overwrites the app file on the PR branch with a clear text warning to generate the red diff
          mkdir -p "argocd-apps/${{ steps.parse.outputs.target_repo }}"
          echo "DEACTIVATION_AUTHORIZED: This tracking node is marked for complete platform removal." > "argocd-apps/${{ steps.parse.outputs.target_repo }}/DELETION_NOTICE.txt"
          
          git add .
          git commit -m "chore: inject infrastructure deactivation manifest clearance logs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  # PHASE 2: Triggered ONLY when an admin explicitly reviews the diff and clicks MERGE
  execute-platform-destruction:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'cleanup-remove-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Branch Following Merge
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_DELETE_PAT }}

      - name: Extract Target App Name
        id: parse
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          REPO_TO_DELETE="${BRANCH_NAME#cleanup-remove-}"
          echo "target_repo=$REPO_TO_DELETE" >> $GITHUB_OUTPUT

      - name: Wipe Folder Completely From Main Branch
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          rm -rf "argocd-apps/${{ steps.parse.outputs.target_repo }}"
          git add .
          git commit -m "chore: purge registration directory for ${{ steps.parse.outputs.target_repo }} [skip ci]" || echo "Clear"
          git push origin main

      - name: Permanently Delete Standalone Target Repository via REST API
        env:
          ACCOUNT_TOKEN: ${{ secrets.REPO_DELETE_PAT }}
        run: |
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $ACCOUNT_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository_owner }}/${{ steps.parse.outputs.target_repo }}")
          if [ "$RESPONSE" -ne 204 ]; then
            echo "API Deletion Failure"
            cat response.json
            exit 1
          fi
          echo "Success! Target repository permanently deleted."