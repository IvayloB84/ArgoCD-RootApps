name: Post-Merge Target Repository Deletion

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  delete-external-repo:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'cleanup-remove-')
    runs-on: ubuntu-latest

    steps:
      - name: Extract Repository Name from Branch
        id: parse
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          REPO_TO_DELETE="${BRANCH_NAME#cleanup-remove-}"
          echo "target_repo=$REPO_TO_DELETE" >> $GITHUB_OUTPUT

      - name: Permanently Delete Target Repository via REST API
        env:
          # Using your working PAT is mandatory for cross-repository administration actions
          GITHUB_TOKEN: ${{ secrets.REPO_DELETE_PAT }} 
        run: |
          echo "Merging completed. Deleting standalone repository: ${{ steps.parse.outputs.target_repo }}"
          
          # xargs trims any accidental trailing whitespaces or hidden linebreaks from the secret string
          CLEAN_TOKEN=$(echo "$GITHUB_TOKEN" | xargs)
          
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CLEAN_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository_owner }}/${{ steps.parse.outputs.target_repo }}")

          if [ "$RESPONSE" -ne 204 ]; then
            echo "API Execution Failed with Status Code: $RESPONSE"
            cat response.json
            exit 1
          fi
          echo "Success! Repository has been permanently removed."