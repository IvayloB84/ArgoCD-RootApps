name: Automated Deactivation and Repository Cleanup

on:
  pull_request:
    types: [opened, closed]
    branches:
      - main

jobs:
  # PHASE 1: Wakes up when Backstage opens the PR and pushes the folder deletion diff for the administrator
  inject-folder-deletion:
    if: github.event.action == 'opened' && startsWith(github.event.pull_request.head.ref, 'cleanup-remove-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backstage PR Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.REPO_DELETE_PAT }}

      - name: Extract Target App Name
        id: parse
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          REPO_TO_DELETE="${BRANCH_NAME#cleanup-remove-}"
          echo "target_repo=$REPO_TO_DELETE" >> $GITHUB_OUTPUT

      - name: Commit and Push Folder Deletion directly to PR
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Force delete the directory from the branch disk
          rm -rf "argocd-apps/${{ steps.parse.outputs.target_repo }}"
          
          git add .
          git commit -m "chore: automated removal of argocd-apps/${{ steps.parse.outputs.target_repo }} layout"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  # PHASE 2: Wakes up ONLY when the administrator clicks Merge to permanently delete the code repository
  delete-external-repo:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'cleanup-remove-')
    runs-on: ubuntu-latest
    steps:
      - name: Extract Target Repository Name
        id: parse
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          REPO_TO_DELETE="${BRANCH_NAME#cleanup-remove-}"
          echo "target_repo=$REPO_TO_DELETE" >> $GITHUB_OUTPUT

      - name: Permanently Delete Target Repository via REST API
        env:
          ACCOUNT_TOKEN: ${{ secrets.REPO_DELETE_PAT }}
        run: |
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $ACCOUNT_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository_owner }}/${{ steps.parse.outputs.target_repo }}")

          if [ "$RESPONSE" -ne 204 ]; then
            echo "API Execution Failed with Status Code: $RESPONSE"
            cat response.json
            exit 1
          fi
          echo "Success! Repository has been permanently removed."