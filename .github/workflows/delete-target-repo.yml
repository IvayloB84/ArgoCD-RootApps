name: Post-Merge Target Repository Deletion

on:
  push:
    branches:
      - main
    paths:
      - 'argocd-apps/**'

jobs:
  delete-external-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code to Inspect Commit Diff
        uses: actions/checkout@v7
        with:
          fetch-depth: 2 
          token: ${{ secrets.REPO_DELETE_PAT }} 

      - name: Extract Repository Name from Modified Folders
        id: parse
        run: |
          # Detects the component name from the modified folder in the git changes
          MODIFIED_FOLDER=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '^argocd-apps/' | awk -F'/' '{print $2}' | sed 's/\.deleted$//' | uniq | head -n 1)
          
          if [ -z "$MODIFIED_FOLDER" ]; then
            echo "No folder modification detected in the argocd-apps path. Terminating."
            exit 0
          fi
          
          echo "target_repo=$MODIFIED_FOLDER" >> $GITHUB_OUTPUT

      - name: Force Clean Folder Container Footprints from Main Branch
        if: steps.parse.outputs.target_repo != ''
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Thoroughly purges any residual folders or placeholders from the main branch
          rm -rf "argocd-apps/${{ steps.parse.outputs.target_repo }}"
          rm -rf "argocd-apps/${{ steps.parse.outputs.target_repo }}.deleted"
          
          git add .
          git commit -m "chore: clear directory footprints for ${{ steps.parse.outputs.target_repo }} [skip ci]" || echo "Clean"
          git push origin main

      - name: Permanently Delete Standalone Target Repository via REST API
        if: steps.parse.outputs.target_repo != ''
        env:
          ACCOUNT_TOKEN: ${{ secrets.REPO_DELETE_PAT }}
        run: |
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $ACCOUNT_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository_owner }}/${{ steps.parse.outputs.target_repo }}")

          if [ "$RESPONSE" -ne 204 ]; then
            echo "API Execution Failed with Status Code: $RESPONSE"
            cat response.json
            exit 1
          fi
          echo "Success! Repository has been permanently removed."
