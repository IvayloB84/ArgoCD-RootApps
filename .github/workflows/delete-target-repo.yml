name: Post-Merge Target Repository Deletion

on:
  # This event executes with full repository secrets access
  workflow_run:
    workflows: ["CI/CD Pipeline"] # Must match the exact name of your primary pipeline
    types:
      - completed

jobs:
  delete-external-repo:
    # Only execute if the upstream pipeline completed and it was a Backstage branch merge
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'cleanup-remove-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Extract Repository Name from Upstream Branch
        id: parse
        run: |
          BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          REPO_TO_DELETE="${BRANCH_NAME#cleanup-remove-}"
          echo "target_repo=$REPO_TO_DELETE" >> $GITHUB_OUTPUT

      - name: Permanently Delete Target Repository via REST API
        env:
          ACCOUNT_TOKEN: ${{ secrets.REPO_DELETE_PAT }}
        run: |
          echo "Upstream merge pipeline completed. Deleting standalone repository: ${{ steps.parse.outputs.target_repo }}"
          
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $ACCOUNT_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository_owner }}/${{ steps.parse.outputs.target_repo }}")

          if [ "$RESPONSE" -ne 204 ]; then
            echo "API Execution Failed with Status Code: $RESPONSE"
            cat response.json
            exit 1
          fi
          echo "Success! Repository has been permanently removed from your profile."
