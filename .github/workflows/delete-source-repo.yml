name: GitOps Delayed Repository Purge
on:
  push:
    branches:
      - main

jobs:
  delete-repo:
    if: contains(github.event.head_commit.message, 'purge/')
    runs-on: ubuntu-latest
    steps:
      - name: Extract Target Repository Name from Commit
        id: parse
        run: |
          MSG="${{ github.event.head_commit.message }}"
          REPO_NAME=$(echo "$MSG" | grep -m 1 -oE 'purge/[a-zA-Z0-9_-]+' | cut -d'/' -f2)
          echo "target_repo=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Permanently Delete Standalone Application Repository
        run: |
          curl -L \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.BACKSTAGE_LOCAL }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository_owner }}/${{ steps.parse.outputs.target_repo }}

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BACKSTAGE_LOCAL }}

      - name: Delete Folder and Push Changes
        run: |
          git config --global user.name "backstage-bot"
          git config --global user.email "backstage-bot@users.noreply.github.com"
          
          TARGET_PATH="argocd-apps/${{ steps.parse.outputs.target_repo }}"
          
          if [ -d "$TARGET_PATH" ]; then
            rm -rf "$TARGET_PATH"
            git add .
            git commit -m "infrastructure: purge folder for ${{ steps.parse.outputs.target_repo }} [skip ci]"
            git push origin main
            echo "Successfully purged and pushed changes for $TARGET_PATH"
          else
            echo "Directory $TARGET_PATH does not exist, skipping file deletion step."
          fi
