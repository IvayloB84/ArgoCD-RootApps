name: GitOps Delayed Repository Purge
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  delete-repo:
    # 🔒 Ensure this only fires if the PR was successfully merged and came from our Backstage branch layout
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'purge/')
    runs-on: ubuntu-latest
    steps:
      - name: Extract Target Repository Name from Branch
        id: parse
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          # Strips out the 'purge/' prefix to isolate the application repo name string cleanly
          REPO_NAME="${BRANCH#purge/}"
          echo "target_repo=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Permanently Delete Standalone Application Repository
        run: |
          curl -L \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITOPS_DELETE_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository_owner }}/${{ steps.parse.outputs.target_repo }}