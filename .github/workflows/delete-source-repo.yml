name: GitOps Delayed Repository Purge
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_repo_name:
        description: 'Target repository name to test preview (e.g., my-modern-java-service)'
        required: true
        type: string
        default: 'my-modern-java-service'

jobs:
  delete-repo:
    # Ensure it runs either on a purge commit or when manually triggered via UI
    if: contains(github.event.head_commit.message, 'purge/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Extract Target Repository Name
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REPO_NAME="${{ inputs.test_repo_name }}"
          else
            MSG="${{ github.event_head_commit.message }}"
            REPO_NAME=$(echo "$MSG" | grep -m 1 -oE 'purge/[a-zA-Z0-9_-]+' | cut -d'/' -f2)
          fi
          echo "target_repo=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BACKSTAGE_LOCAL }}

      - name: Preview What Will Be Deleted
        run: |
          TARGET_PATH="argocd-apps/${{ steps.parse.outputs.target_repo }}"
          
          echo "=================================================="
          echo "PREVIEW: THE FOLLOWING ITEMS WILL BE DELETED:"
          echo "=================================================="
          
          if [ -d "$TARGET_PATH" ]; then
            find "$TARGET_PATH"
          else
            echo "ERROR: Target directory '$TARGET_PATH' does not exist!"
          fi
          
          echo "=================================================="