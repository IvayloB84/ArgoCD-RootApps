name: Zero-Touch Lifecycle Deletion Engine
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  execute-purge:
    # 🔒 Ensure this only fires if the PR was successfully merged and came from our Backstage branch layout
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'purge/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Central Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_DELETE_TOKEN }}
          fetch-depth: 0

      - name: Extract Target Meta Information
        id: parse
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          REPO_NAME="${BRANCH#purge/}"
          echo "target_repo=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Execute Clean Git File and Folder Erasure
        run: |
          git config --global user.name "GitOps Automation Engine"
          git config --global user.email "gitops-engine@localhost"

          # 🧼 Clean 1: Permanently delete the targeted app manifest tree folder completely
          if [ -d "argocd-apps/${{ steps.parse.outputs.target_repo }}" ]; then
            git rm -r "argocd-apps/${{ steps.parse.outputs.target_repo }}"
          fi

          # 🧼 Clean 2: Remove the incoming request manifest file to keep directories spotless
          if [ -f "deactivation-requests/${{ steps.parse.outputs.target_repo }}.yaml" ]; then
            git rm "deactivation-requests/${{ steps.parse.outputs.target_repo }}.yaml"
          fi

          # Commit the pure file removals back directly to main
          git commit -m "automation(gitops): permanently purged all infrastructure paths for ${{ steps.parse.outputs.target_repo }}"
          git push origin main

      - name: Permanently Delete Standalone Code Repository from GitHub
        run: |
          curl -L \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITOPS_DELETE_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository_owner }}/${{ steps.parse.outputs.target_repo }}
