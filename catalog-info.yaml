apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: {{ values.name }}
  description: Spring Boot 4 microservice (Java {{ values.javaVersion }})
  annotations:
    github.com/project-slug: {{ values.owner }}/{{ values.name }}
    argocd/app-name: {{ values.name }}
spec:
  type: service
  lifecycle: production
  owner: {{ values.owner }}
  system: java-platform
