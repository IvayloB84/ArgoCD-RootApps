apiVersion: apps/v1
kind: Deployment
metadata:
  name: "hird-party"
  labels:
    app: "hird-party"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "hird-party"
  template:
    metadata:
      labels:
        app: "hird-party"
    spec:
      containers:
        # 1. Core Service Application Runtime (Generic Context)
        - name: app-container
          image: "nginx:alpine"
          ports:
            - containerPort: 80
          command: []
          args: []
          volumeMounts:
            - name: code-stream-volume
              mountPath: "/usr/share/nginx/html"
          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "150m"
              memory: "32Mi"
          env:
            - name: SERVICE_TYPE
              value: "nginx"
            - name: WEB_SERVER_ROUTING_PROFILE
              value: "standard-spa"

        # 2. Automated Git-Sync Core Engine (Upgraded to v4.7.1)
        - name: git-sync-sidecar
          image: "registry.k8s.io/git-sync/git-sync:v4.7.1"
          args:
            - "--repo=https://github.com/IvayloB84/hird-party.git"
            - "--branch=main"
            - "--depth=1"
            - "--wait=10"
            - "--root=/tmp/git"
          volumeMounts:
            - name: code-stream-volume
              mountPath: /tmp/git
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534

      # Shared internal workspace volume declaration connecting the containers
      volumes:
        - name: code-stream-volume
          emptyDir: {}