apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rust-articles-pvc
  namespace: target-production-apps
  annotations:
    argocd.argoproj.io/sync-options: Replace=false,ServerSideApply=true
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
