apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantum-mesh-node
  labels:
    app: quantum-mesh-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantum-mesh-node
  template:
    metadata:
      labels:
        app: quantum-mesh-node
    spec:
      containers:
        - name: app-container
          image: "nginx:alpine"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: quantum-mesh-node
  labels:
    app: quantum-mesh-node
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: quantum-mesh-node