apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-vortex-bridge-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-vortex-bridge
  template:
    metadata:
      labels:
        app: nexus-vortex-bridge
    spec:
      containers:
        - name: app-container
          image: eclipse-temurin:17-jre-alpine
          ports:
            - containerPort: 8080
          resources: {} 
