apiVersion: apps/v1
kind: Deployment
metadata:
  name: "nova-core-vault-v1-static"
  labels:
    app: "nova-core-vault-v1-static"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "nova-core-vault-v1-static"
  template:
    metadata:
      labels:
        app: "nova-core-vault-v1-static"
    spec:
      securityContext:
        fsGroup: 65534
      initContainers:
        - name: wait-for-gitsync
          image: busybox:1.38
          command: ["/bin/sh", "-c"]
          args:
            - |
              while [ ! -d "/usr/share/nginx/html/nova-core-vault-v1" ]; do
                echo "Waiting for git-sync directory..."
                sleep 2
              done

      containers:
        # 1. Unprivileged Traditional Asset Server Layer
        - name: static-container
          image: "nginx:alpine"
          ports:
            - containerPort: 8254
          env:
            - name: "NGINX_PORT"
              value: "8254"
          volumeMounts:
            - name: code-stream-volume
              mountPath: "/usr/share/nginx/html"
            - name: config-volume
              mountPath: "/etc/nginx/conf.d/default.conf"
              subPath: "default.conf"
            - name: tmp-fs
              mountPath: /tmp
            - name: var-cache
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "300m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101

        # 2. Automated Git-Sync Synchronization Sidecar Engine Layer
        - name: git-sync-sidecar
          image: "registry.k8s.io/git-sync/git-sync:v4.7.1"
          args:
            - "--repo=https://github.com/IvayloB84/nova-core-vault-v1.git"
            - "--ref=main"
            - "--depth=1"
            - "--period=10s"
            - "--root=/tmp/git"
            - "--link=nova-core-vault-v1"
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: code-stream-volume
              mountPath: /tmp/git
            - name: tmp-fs
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsGroup: 65534
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "300m"
              memory: "64Mi"

      volumes:
        - name: code-stream-volume
          emptyDir: {}
        - name: tmp-fs
          emptyDir: {}
        - name: var-cache
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: config-volume
          configMap:
            name: "nova-core-vault-v1-static-config"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "nova-core-vault-v1-static-config"
data:
  default.conf: |
    server {
        listen       8254;
        listen  [::]:8254;
        server_name  localhost;

        location /healthz {
            return 200 "healthy\n";
        }

        # Traditional Asset Server Configuration
        location / {
            root /usr/share/nginx/html/nova-core-vault-v1;
            autoindex on;            
            try_files $uri $uri/ =404; 
        }
    }
