apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "alpha-core-router"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/IvayloB84/ArgoCD-RootApps.git"
    targetRevision: HEAD
    path: "argocd-apps/alpha-core-router/k8s"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
