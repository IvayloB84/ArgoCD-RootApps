apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-recursive-apex-v1
  labels:
    app: gitops-recursive-apex-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-recursive-apex-v1
  template:
    metadata:
      labels:
        app: gitops-recursive-apex-v1
    spec:
      containers:
        - name: app-container
          image: "redis:alpine"
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-recursive-apex-v1
  labels:
    app: gitops-recursive-apex-v1
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: gitops-recursive-apex-v1