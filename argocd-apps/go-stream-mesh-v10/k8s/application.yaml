apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: '{{ values.repoName }}'
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/{{ values.repoOwner }}/{{ values.repoName }}.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true