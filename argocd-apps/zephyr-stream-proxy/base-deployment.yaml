apiVersion: apps/v1
kind: Deployment
metadata:
  name: zephyr-stream-proxy-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zephyr-stream-proxy
  template:
    metadata:
      labels:
        app: zephyr-stream-proxy
    spec:
      containers:
        - name: app-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources: {} 
