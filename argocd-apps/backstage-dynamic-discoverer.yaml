apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backstage-scaffolded-discoverer
  namespace: argocd
spec:
  generators:
    # 🔍 AUTHENTICATED CRAWLER: Uses your token secret to scan your profile for new repos
    - gitSCMProvider:
        github:
          user: "IvayloB84"
          tokenRef:
            secretName: github-token-secret
            key: token
        filters:
          - repositoryMatch: .*
          # 🎯 TOPIC FILTER: Only deploys repositories carrying this specific tag
          - topicMatch: kubernetes-enabled 
  template:
    metadata:
      # Dynamically names the target application block using the GitHub repo name
      name: '{{ repository }}'
    spec:
      project: default
      source:
        repoURL: '{{ html_url }}'
        targetRevision: main
        path: k8s
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
