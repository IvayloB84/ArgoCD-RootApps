apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backstage-scaffolded-discoverer
  namespace: argocd
spec:
  generators:
    - scmProvider:
        github:
          organization: "IvayloB84"
          tokenRef:
            secretName: github-token-secret
            key: token
  template:
    metadata:
      name: '{{ repository }}'
    spec:
      project: default
      source:
        repoURL: '{{ html_url }}'
        targetRevision: main
        path: k8s
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
