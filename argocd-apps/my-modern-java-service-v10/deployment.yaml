apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-modern-java-service-v10
  labels:
    app: my-modern-java-service-v10
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-modern-java-service-v10
  template:
    metadata:
      labels:
        app: my-modern-java-service-v10
    spec:
      containers:
        - name: my-modern-java-service-v10
          # This image must exist in the registry before ArgoCD syncs — a CI
          # pipeline (not part of this scaffolder) needs to build and push it.
          image: ghcr.io/ivaylob84/my-modern-java-service-v10:79fc13f28229a8833aa24f4682430ccda55203f1
          ports:
            - containerPort: 8438
          # TCP probes work regardless of whether 'actuator' was selected as
          # a dependency. If you did select actuator, swap these for
          # httpGet on /actuator/health/{liveness,readiness} instead.
          readinessProbe:
            tcpSocket:
              port: 8438
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8438
            initialDelaySeconds: 20
            periodSeconds: 15