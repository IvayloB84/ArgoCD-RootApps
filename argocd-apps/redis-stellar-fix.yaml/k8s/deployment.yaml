apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-stellar-fix
  namespace: default
  labels:
    app: redis-stellar-fix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-stellar-fix
  template:
    metadata:
      labels:
        app: redis-stellar-fix
    spec:
      containers:
        - name: app-container
          image: redis:alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-stellar-fix
  namespace: default
  labels:
    app: redis-stellar-fix
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis-stellar-fix