apiVersion: apps/v1
kind: Deployment
metadata:
  name: "edge-routing-mesh-v3-proxy"
  labels:
    app: "edge-routing-mesh-v3-proxy"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "edge-routing-mesh-v3-proxy"
  template:
    metadata:
      labels:
        app: "edge-routing-mesh-v3-proxy"
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        # 1. Reverse Proxy Routing Engine (Nginx Unprivileged)
        - name: proxy-container
          image: "nginx:1.25-alpine"
          ports:
            - containerPort: 9090
          env:
            - name: "NGINX_PORT"
              value: "9090"
          volumeMounts:
            - name: config-volume
              mountPath: "/etc/nginx/nginx.conf"
              subPath: "nginx.conf"
            - name: tmp-fs
              mountPath: /tmp
            # [FIX 1/3] Mount writable directories for stock Nginx script initialization
            - name: var-cache
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "150m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101

      volumes:
        - name: tmp-fs
          emptyDir: {} 
        # [FIX 2/3] Define the physical storage scratchpads in host memory
        - name: var-cache
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: config-volume
          configMap:
            name: "edge-routing-mesh-v3-proxy-config"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "edge-routing-mesh-v3-proxy-config"
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        # [FIX 3/3] Dynamic routing fallback default targeting your working SPA engine
        upstream spa_upstream {
            server spa-delivery-engine:80;
        }

        server {
            listen       9090;
            listen  [::]:9090;
            server_name  localhost;

            # Health probe endpoint for the proxy
            location /healthz {
                return 200 "healthy\n";
            }

            # Forward everything else to your existing, working SPA engine
            location / {
                proxy_pass http://spa_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }