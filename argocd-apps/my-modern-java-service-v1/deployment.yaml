apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-modern-java-service-v1
  labels:
    app: my-modern-java-service-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-modern-java-service-v1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: my-modern-java-service-v1
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: my-modern-java-service-v1
          image: ghcr.io/ivaylob84/my-modern-java-service-v1:latest
          env:
            - name: SERVER_PORT
              value: "8371"
          ports:
            - name: http
              containerPort: 8371
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          startupProbe:
            tcpSocket:
              port: 8371
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 8371
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8371
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 60