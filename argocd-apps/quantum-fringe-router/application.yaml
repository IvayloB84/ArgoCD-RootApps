apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quantum-vault-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/IvayloB84/ArgoCD-RootApps.git"
    targetRevision: HEAD
    path: "argocd-apps/quantum-vault-sync"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
