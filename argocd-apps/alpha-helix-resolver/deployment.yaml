apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-helix-resolver
  labels:
    app: alpha-helix-resolver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpha-helix-resolver
  template:
    metadata:
      labels:
        app: alpha-helix-resolver
    spec:
      containers:
        - name: app-container
          image: "eclipse-temurin:17-jre-alpine"
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_TYPE
              value: ""
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: ""
            - name: POSTGRES_DB
              value: "postgres"
            - name: REDIS_PASSWORD
              value: ""
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m"
            - name: APP_ENV
              value: "development"
            - name: NGINX_ROUTING_PROFILE
              value: ""
---
apiVersion: v1
kind: Service
metadata:
  name: alpha-helix-resolver
  labels:
    app: alpha-helix-resolver
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: alpha-helix-resolver