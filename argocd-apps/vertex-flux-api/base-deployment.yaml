apiVersion: apps/v1
kind: Deployment
metadata:
  name: vertex-flux-api-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vertex-flux-api
  template:
    metadata:
      labels:
        app: vertex-flux-api
    spec:
      containers:
        - name: app-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources: {} 
