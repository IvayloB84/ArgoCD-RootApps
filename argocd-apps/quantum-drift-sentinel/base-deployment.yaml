apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantum-drift-sentinel-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantum-drift-sentinel
  template:
    metadata:
      labels:
        app: quantum-drift-sentinel
    spec:
      containers:
        - name: app-container
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          resources: {} 
