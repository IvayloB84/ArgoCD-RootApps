apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rails-articles-app-pipeline
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/IvayloB84/ArgoCD-RootApps 
      targetRevision: HEAD
      path: argocd-apps/rails-articles-app
    - repoURL: https://github.com/IvayloB84/rails-articles-app
      targetRevision: HEAD
      path: rails-app-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
