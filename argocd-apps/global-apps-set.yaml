apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backstage-automation-engine
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/IvayloB84/ArgoCD-RootApps'
        revision: main
        directories:
          - path: "argocd-apps/*"
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: "{{path.basename}}"
    spec:
      project: default
      source:
        repoURL: "https://github.com/IvayloB84/{{path.basename}}"
        targetRevision: main
        path: "."
        # ADD THIS DIRECTORY BLOCK TO EXCLUDE THE DUPLICATE CONFIG FILE
        directory:
          exclude: "argocd-app.yaml"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true