apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backstage-automation-engine
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/IvayloB84/ArgoCD-RootApps'
        revision: main
        directories:
          # The trailing /k8s tells ArgoCD to look exactly where the manifests are
          - path: "argocd-apps/*/k8s"
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: "{{path.basenameNormalized}}"
    spec:
      project: default
      source:
        repoURL: "https://github.com/IvayloB84/{{path.basenameNormalized}}"
        targetRevision: main
        path: "."
      destination:
        server: "https://kubernetes.default.svc"
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
