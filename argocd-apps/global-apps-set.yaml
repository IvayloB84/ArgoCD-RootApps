apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backstage-automation-engine
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: "https://github.com/IvayloB84/ArgoCD-RootApps"
        revision: main
        directories:
          - path: "argocd-apps/*"
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: "{{path.basename}}"
    spec:
      project: default
      source:
        # Target the umbrella GitOps directory instead of individual app repos
        repoURL: "https://github.com/IvayloB84/ArgoCD-RootApps"
        targetRevision: main
        # Evaluates cleanly to the specific folder (e.g., argocd-apps/nova-core-vault-v1)
        path: "{{path}}"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true