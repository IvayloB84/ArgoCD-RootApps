apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backstage-automation-engine
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - git:
              repoURL: "https://github.com/IvayloB84/ArgoCD-RootApps.git"
              revision: main
              directories:
                - path: "argocd-apps/*/"
          - git:
              repoURL: "https://github.com/IvayloB84/backstage-templates.git"
              revision: main
              pathParamPrefix: backstage-pilot 
              files:
                - path: "k8s/deployment.yaml"
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: "{{path.basename}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: "{{path}}/*"
    spec:
      project: default
      sources:
        - repoURL: "https://github.com/IvayloB84/ArgoCD-RootApps.git"
          targetRevision: main
          path: "{{path}}/k8s"
        - repoURL: "https://github.com/IvayloB84/{{path.basename}}.git"
          targetRevision: main
          ref: active-component-code
      destination:
        server: "https://kubernetes.default.svc"
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true