apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backstage-automation-engine
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: "https://github.com/IvayloB84/ArgoCD-RootApps"
        revision: main
        directories:
          # The trailing glob allows ArgoCD to discover directories that contain nested subfolders
          - path: "argocd-apps/*"
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      # Automatically resolves to 'nova-core-vault-v1' 
      name: "{{path.basename}}"
    spec:
      project: default
      source:
        repoURL: "https://github.com/IvayloB84/ArgoCD-RootApps"
        targetRevision: main
        # This keeps the deployment targeting the whole folder root, not just k8s
        path: "{{path}}"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true