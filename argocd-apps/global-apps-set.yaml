apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backstage-automation-engine
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/IvayloB84/ArgoCD-RootApps.git'
        revision: main
        directories:
          - path: "argocd-apps/*"
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: "{{path.basename}}"
    spec:
      project: default
      source:
        repoURL: 'https://github.com/IvayloB84/ArgoCD-RootApps.git'
        targetRevision: main
        path: "argocd-apps/{{path.basename}}/k8s/overlays/production"
        # No `directory:` block here — its presence forces raw recursive
        # apply and SKIPS Kustomize auto-detection. Since this path has its
        # own kustomization.yaml, omitting `directory` lets ArgoCD build it
        # with Kustomize instead, which is what we actually want.
      destination:
        server: "https://kubernetes.default.svc"
        namespace: target-production-apps
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - Replace=true