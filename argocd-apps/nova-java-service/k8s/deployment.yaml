apiVersion: apps/v1
kind: Deployment
metadata:
  name: "nova-java-service"
  labels:
    app: "nova-java-service"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "nova-java-service"
  template:
    metadata:
      labels:
        app: "nova-java-service"
    spec:
      containers:
        - name: app-container
          image: "eclipse-temurin:17-jre-alpine"
          ports:
            - containerPort: 8080
          command: sh,-c

          args: echo Runtime container initialized. Waiting for code deployment... && sleep infinity

          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "150m"
              memory: "32Mi"
          env:
            - name: SERVICE_TYPE
              value: "java"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: ""
            - name: POSTGRES_DB
              value: "postgres"
            - name: REDIS_PASSWORD
              value: ""
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m"
            - name: APP_ENV
              value: "development"
            - name: NGINX_ROUTING_PROFILE
              value: ""