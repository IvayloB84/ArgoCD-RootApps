apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nova-core-vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/IvayloB84/nova-core-vault.git'
    targetRevision: HEAD
    path: '.'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true