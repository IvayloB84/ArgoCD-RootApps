apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "private-windows"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/IvayloB84/private-windows.git"
    targetRevision: "main"
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
