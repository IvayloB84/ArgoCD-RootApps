apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "{{ 'JHt7IHZhbHVlcy5yZXBvTmFtZSB9fQ==' | b64dec }}"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com{{ values.repoOwner }}/{{ values.repoName }}.git
    targetRevision: HEAD
    path: ./
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true