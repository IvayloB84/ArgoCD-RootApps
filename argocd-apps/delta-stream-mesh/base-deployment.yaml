apiVersion: apps/v1
kind: Deployment
metadata:
  name: delta-stream-mesh-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delta-stream-mesh
  template:
    metadata:
      labels:
        app: delta-stream-mesh
    spec:
      containers:
        - name: app-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources: {} 
