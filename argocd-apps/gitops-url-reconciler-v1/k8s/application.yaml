apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "gitops-url-reconciler-v1"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/IvayloB84/gitops-url-reconciler-v1.git"
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true