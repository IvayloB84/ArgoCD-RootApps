apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{repoName}}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com{{repoOwner}}/{repoName}}.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true