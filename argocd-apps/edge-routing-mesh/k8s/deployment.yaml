apiVersion: apps/v1
kind: Deployment
metadata:
  name: "edge-routing-mesh-proxy"
  labels:
    app: "edge-routing-mesh-proxy"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "edge-routing-mesh-proxy"
  template:
    metadata:
      labels:
        app: "edge-routing-mesh-proxy"
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        # 1. Reverse Proxy Routing Engine (Nginx Unprivileged)
        - name: proxy-container
          image: "nginx:1.25-alpine"
          ports:
            - containerPort: 9090
          env:
            - name: "NGINX_PORT"
              value: "9090"
          volumeMounts:
            - name: config-volume
              mountPath: "/etc/nginx/nginx.conf"
              subPath: "nginx.conf"
            - name: tmp-fs
              mountPath: /tmp
          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "150m"
              memory: "32Mi"
          securityContext:
            runAsUser: 101
            runAsGroup: 101

      volumes:
        - name: tmp-fs
          emptyDir: {} # Required for unprivileged nginx pid and cache files
        - name: config-volume
          configMap:
            name: "edge-routing-mesh-proxy-config"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "edge-routing-mesh-proxy-config"
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;

        # Target pointing back to your working SPA service name
        upstream spa_upstream {
            server my-spa-service:8080;
        }

        server {
            listen       9090;
            listen  [::]:9090;
            server_name  localhost;

            # Health probe endpoint for the proxy
            location /healthz {
                return 200 "healthy\n";
            }

            # Forward everything else to your existing, working SPA engine
            location / {
                proxy_pass http://spa_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }