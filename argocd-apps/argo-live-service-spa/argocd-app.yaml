apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-live-service-spa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/IvayloB84/argo-live-service-spa.git'
    targetRevision: HEAD
    path: '.'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
