apiVersion: apps/v1
kind: Deployment
metadata:
  name: Aether-Flux-Gateway-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: Aether-Flux-Gateway
  template:
    metadata:
      labels:
        app: Aether-Flux-Gateway
    spec:
      containers:
        - name: app-container
          image: eclipse-temurin:17-jre-alpine
          ports:
            - containerPort: 8080
          resources: {} 
