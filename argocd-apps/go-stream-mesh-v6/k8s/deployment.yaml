apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-stream-mesh-v6
  namespace: default
  labels:
    app: go-stream-mesh-v6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-stream-mesh-v6
  template:
    metadata:
      labels:
        app: go-stream-mesh-v6
    spec:
      containers:
        - name: app-container
          image: redis:alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: go-stream-mesh-v6
  namespace: default
  labels:
    app: go-stream-mesh-v6
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: go-stream-mesh-v6