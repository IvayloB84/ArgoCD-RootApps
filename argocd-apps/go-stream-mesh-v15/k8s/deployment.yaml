apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ values.repoName }}
  namespace: default
  labels:
    app: {{ values.repoName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ values.repoName }}
  template:
    metadata:
      labels:
        app: {{ values.repoName }}
    spec:
      containers:
        - name: app-container
          image: {{ values.image }}
          ports:
            - containerPort: {{ values.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ values.repoName }}
  namespace: default
  labels:
    app: {{ values.repoName }}
spec:
  ports:
    - port: {{ values.port }}
      targetPort: {{ values.port }}
  selector:
    app: {{ values.repoName }}