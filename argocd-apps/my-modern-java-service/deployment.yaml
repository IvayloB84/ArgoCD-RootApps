apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-modern-java-service
  labels:
    app: my-modern-java-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-modern-java-service
  template:
    metadata:
      labels:
        app: my-modern-java-service
    spec:
      containers:
        - name: my-modern-java-service
          # This image must exist in the registry before ArgoCD syncs — a CI
          # pipeline (not part of this scaffolder) needs to build and push it.
          image: ghcr.io/ivaylob84/my-modern-java-service:c833c091437c4ec92c116f45ce08a443ac516510
          ports:
            - containerPort: 8080
          # TCP probes work regardless of whether 'actuator' was selected as
          # a dependency. If you did select actuator, swap these for
          # httpGet on /actuator/health/{liveness,readiness} instead.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15