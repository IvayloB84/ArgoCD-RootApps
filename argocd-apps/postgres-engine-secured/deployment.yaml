apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-engine-secured
  labels:
    app: postgres-engine-secured
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-engine-secured
  template:
    metadata:
      labels:
        app: postgres-engine-secured
    spec:
      containers:
        - name: app-container
          image: "postgres:16-alpine"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-engine-secured
  labels:
    app: postgres-engine-secured
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-engine-secured