apiVersion: apps/v1
kind: Deployment
metadata:
  name: "argo-live-service-static-assets-static"
  labels:
    app: "argo-live-service-static-assets-static"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "argo-live-service-static-assets-static"
  template:
    metadata:
      labels:
        app: "argo-live-service-static-assets-static"
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        # 1. Unprivileged Traditional Asset Server Layer
        - name: static-container
          image: "nginx:alpine"
          ports:
            - containerPort: 9393
          env:
            - name: "NGINX_PORT"
              value: "9393"
          volumeMounts:
            - name: code-stream-volume
              mountPath: "/usr/share/nginx/html"
            - name: config-volume
              mountPath: "/etc/nginx/conf.d/default.conf"
              subPath: "default.conf"
            - name: tmp-fs
              mountPath: /tmp
            - name: var-cache
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "150m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 101
            runAsGroup: 101

        # 2. Automated Git-Sync Synchronization Sidecar Engine Layer
        - name: git-sync-sidecar
          image: "registry.k8s.io/git-sync/git-sync:v4.7.1"
          args:
            - "--repo=https://github.com/IvayloB84/argo-live-service-static-assets.git"
            - "--branch=main"
            - "--depth=1"
            - "--wait=10"
            - "--root=/tmp/git"
            - "--dest=argo-live-service-static-assets"
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: code-stream-volume
              mountPath: /tmp/git
            - name: tmp-fs
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 65534
            runAsGroup: 65534
          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "150m"
              memory: "32Mi"

      volumes:
        - name: code-stream-volume
          emptyDir: {}
        - name: tmp-fs
          emptyDir: {}
        - name: var-cache
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: config-volume
          configMap:
            name: "argo-live-service-static-assets-static-config"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "argo-live-service-static-assets-static-config"
data:
  default.conf: |
    server {
        listen       9393;
        listen  [::]:9393;
        server_name  localhost;

        location /healthz {
            return 200 "healthy\n";
        }

        # Traditional Asset Server Configuration
        location / {
            root /usr/share/nginx/html/argo-live-service-static-assets;
            autoindex on;            
            try_files $uri $uri/ =404; 
        }
    }
