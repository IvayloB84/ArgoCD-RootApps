apiVersion: apps/v1
kind: Deployment
metadata:
  name: "stream-decouple-test"
  labels:
    app: "stream-decouple-test"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "stream-decouple-test"
  template:
    metadata:
      labels:
        app: "stream-decouple-test"
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        # 1. Web Server Engine Application Core Runtime Layer
        - name: app-container
          image: "nginx:alpine"
          ports:
            - containerPort: 8383
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
          volumeMounts:
            - name: code-stream-volume
              mountPath: "/usr/share/nginx/html"
            - name: config-volume
              mountPath: "/etc/nginx/conf.d/default.conf"
              subPath: "default.conf"
          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "150m"
              memory: "32Mi"

        # 2. Automated Git-Sync Synchronization Engine Layer
        - name: git-sync-sidecar
          image: "registry.k8s.io/git-sync/git-sync:v4.7.1"
          args:
            - "--repo=https://github.com/IvayloB84/stream-decouple-test.git"
            - "--branch=main"
            - "--depth=1"
            - "--wait=10"
            - "--root=/tmp/git"
            - "--dest=stream-decouple-test"
          volumeMounts:
            - name: code-stream-volume
              mountPath: /tmp/git
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

      volumes:
        - name: code-stream-volume
          emptyDir: {}
        - name: config-volume
          configMap:
            name: "stream-decouple-test-nginx-config"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "stream-decouple-test-nginx-config"
data:
  default.conf: |
    server {
        listen       8383;
        listen  [::]:8383;
        server_name  localhost;

        location / {
            root /usr/share/nginx/html/stream-decouple-test;
            autoindex on;
            try_files \$uri \$uri/ @spa;
        }

        location @spa {
            root /usr/share/nginx/html/stream-decouple-test;
            try_files /index.html =404;
        }
    }