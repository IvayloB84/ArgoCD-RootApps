apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenith-lifecycle-router-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zenith-lifecycle-router
  template:
    metadata:
      labels:
        app: zenith-lifecycle-router
    spec:
      containers:
        - name: app-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources: {} 
