apiVersion: apps/v1
kind: Deployment
metadata:
  name: solaris-proxy-mesh
  labels:
    app: solaris-proxy-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solaris-proxy-mesh
  template:
    metadata:
      labels:
        app: solaris-proxy-mesh
    spec:
      containers:
        - name: app-container
          image: "eclipse-temurin:21-jre"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: solaris-proxy-mesh
  labels:
    app: solaris-proxy-mesh
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: solaris-proxy-mesh