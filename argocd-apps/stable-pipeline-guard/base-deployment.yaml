apiVersion: apps/v1
kind: Deployment
metadata:
  name: stable-pipeline-guard-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stable-pipeline-guard
  template:
    metadata:
      labels:
        app: stable-pipeline-guard
    spec:
      containers:
        - name: application
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
