apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "vector-mesh-router"
  # LOCK IN: Kept in argocd namespace so your parent app-of-apps tracks it
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/IvayloB84/vector-mesh-router.git"
    targetRevision: "infra/add-vector-mesh-router"
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    # LANDING ZONE: Where your actual app code pod runs inside the cluster
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true