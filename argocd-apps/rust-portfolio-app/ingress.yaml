apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rust-portfolio-app
  namespace: target-production-apps
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /portfolio
            pathType: Prefix
            backend:
              service:
                name: rust-portfolio-app
                port:
                  number: 80
