<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spa-delivery-engine - SPA Workspace</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            border: 1px solid #30363d;
            padding: 2.5rem;
            border-radius: 6px;
            background-color: #161b22;
            max-width: 500px;
        }
        h1 {
            color: #58a6ff;
            margin-top: 0;
        }
        p {
            color: #8b949e;
        }
        .route-display {
            background-color: #0d1117;
            padding: 0.5rem;
            font-family: monospace;
            border-radius: 4px;
            border: 1px solid #21262d;
            color: #79c0ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>spa-delivery-engine</h1>
        <p>Freshly generated web application.</p>
        <hr style="border-color: #30363d; margin: 1.5rem 0;">
        <p>Single Page Application fallback routing layer is active.</p>
        <p>Current Client-Side Virtual Path:</p>
        <div class="route-display" id="spa-path">/</div>
    </div>
    <script>
        document.getElementById('spa-path').innerText = window.location.pathname;
    </script>
</body>
</html>
