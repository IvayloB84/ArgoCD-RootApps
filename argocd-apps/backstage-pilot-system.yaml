apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-pilot-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/IvayloB84/backstage-pilot"
    path: backstage-manifests
    targetRevision: main
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
