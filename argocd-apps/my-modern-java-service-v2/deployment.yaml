apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-modern-java-service-v2
  labels:
    app: my-modern-java-service-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-modern-java-service-v2
  template:
    metadata:
      labels:
        app: my-modern-java-service-v2
    spec:
      containers:
        - name: my-modern-java-service-v2
          # This image must exist in the registry before ArgoCD syncs — a CI
          # pipeline (not part of this scaffolder) needs to build and push it.
          image: ghcr.io/ivaylob84/my-modern-java-service-v2:52814c032dfbe6663ff44d84b88be3a5ceed2e76
          ports:
            - containerPort: 8026
          # TCP probes work regardless of whether 'actuator' was selected as
          # a dependency. If you did select actuator, swap these for
          # httpGet on /actuator/health/{liveness,readiness} instead.
          readinessProbe:
            tcpSocket:
              port: 8026
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8026
            initialDelaySeconds: 20
            periodSeconds: 15