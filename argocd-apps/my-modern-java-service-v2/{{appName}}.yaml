apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ values.appName }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ values.repoUrl }}
    targetRevision: HEAD
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: target-production-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true