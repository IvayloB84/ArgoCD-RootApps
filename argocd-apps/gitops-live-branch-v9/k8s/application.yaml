apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "gitops-live-branch-v9"
  # 🔒 LOCK IN: Kept in argocd namespace so your parent app-of-apps tracks it
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/IvayloB84/gitops-live-branch-v9.git"
    targetRevision: "infra/add-gitops-live-branch-v9"
    path: .
  destination:
    server: 'https://kubernetes.default.svc'
    # ☸️ LANDING ZONE: Where your actual app code pod runs inside the cluster
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true