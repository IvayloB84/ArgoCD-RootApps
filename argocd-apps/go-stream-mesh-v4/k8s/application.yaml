apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{repoName}}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/{{ values.repoOwner }}/{{ values.repoName }}
    targetRevision: HEAD
    path: ./
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true