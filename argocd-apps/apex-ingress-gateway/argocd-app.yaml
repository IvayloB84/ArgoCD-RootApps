apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apex-ingress-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/IvayloB84/apex-ingress-gateway.git'
    targetRevision: HEAD
    path: '.'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
