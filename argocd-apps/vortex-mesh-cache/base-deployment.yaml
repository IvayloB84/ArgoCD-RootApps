apiVersion: apps/v1
kind: Deployment
metadata:
  name: vortex-mesh-cache-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vortex-mesh-cache
  template:
    metadata:
      labels:
        app: vortex-mesh-cache
    spec:
      containers:
        - name: app-container
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources: {} 
