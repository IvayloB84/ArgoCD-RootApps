apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-core-service
  labels:
    app: nebula-core-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nebula-core-service
  template:
    metadata:
      labels:
        app: nebula-core-service
    spec:
      containers:
        - name: app-container
          image: "redis:alpine"
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: nebula-core-service
  labels:
    app: nebula-core-service
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: nebula-core-service