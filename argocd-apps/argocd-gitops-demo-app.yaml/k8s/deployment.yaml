apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-gitops-demo-app
  namespace: default
  labels:
    app: argocd-gitops-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-gitops-demo-app
  template:
    metadata:
      labels:
        app: argocd-gitops-demo-app
    spec:
      containers:
        - name: app-container
          image: redis:alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-gitops-demo-app
  namespace: default
  labels:
    app: argocd-gitops-demo-app
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: argocd-gitops-demo-app