apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "traditional-media-vault"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/IvayloB84/traditional-media-vault.git"
    targetRevision: HEAD
    path: k8s
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

