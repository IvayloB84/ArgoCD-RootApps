worker_processes auto;
pid /tmp/nginx.pid; # Allows running without root privileges

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    
    # Required writable temporary directories for non-root runtime layers
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Dynamic target pointing cleanly back to your working SPA service name
    upstream spa_upstream {
        server spa-delivery-engine:80;
    }

    server {
        listen       8181;
        listen  [::]:8181;
        server_name  localhost;

        # Health probe endpoint for the proxy to avoid initialization crashes
        location /healthz {
            return 200 "healthy\n";
        }

        # Forward everything else to your working Nginx SPA engine container
        location / {
            proxy_pass http://spa_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}