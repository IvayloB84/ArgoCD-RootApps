apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlas-data-stream
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/IvayloB84/atlas-data-stream'
    targetRevision: HEAD
    path: k8s
    directory:
      exclude: 'catalog-info.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
