apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus-deploy-engine
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/IvayloB84/nexus-deploy-engine.git
    targetRevision: HEAD
    path: ./
    directory:
      include: deployment.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true